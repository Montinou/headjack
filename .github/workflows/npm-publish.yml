name: npm publish

# Publishes @triqual/headjack when a v<version> tag is pushed, through npm trusted publishing (OIDC): no npm token is
# stored anywhere, and npm attaches provenance to the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish @triqual/headjack
    # The private source repository carries this file too and must never publish.
    if: github.repository == 'Montinou/headjack'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: the guard below needs main's history to check the tagged commit against.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache in a publish job: the release is built from a clean install.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main: a tag can only publish what is on main"
            exit 1
          fi
      - name: The tag matches npm/package.json and .claude-plugin/plugin.json
        run: |
          version=$(node -p "require('./npm/package.json').version")
          plugin=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match npm/package.json version v${version}"
            exit 1
          fi
          if [ "$version" != "$plugin" ]; then
            echo "::error::npm/package.json ($version) and .claude-plugin/plugin.json ($plugin) disagree"
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm 11.5.1 or later
        run: |
          current=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n 1)" != "11.5.1" ]; then
            npm install -g npm@11
          fi
          npm --version
      - name: Install
        run: npm ci
      # The unit tests include test/unit/npm-smoke.test.mjs, which packs, installs and runs the package.
      - name: Unit tests
        run: npm run test:unit
      - name: Pack
        run: node scripts/pack-npm.mjs "$RUNNER_TEMP/pkg"
      - name: Publish
        working-directory: ${{ runner.temp }}/pkg
        run: npm publish --access public
