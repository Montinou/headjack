name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; nothing here needs a token with write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Node 24 is the line the suite is verified on: tests in cli-credentials and cli-oauth rely on Node 24's test runner
      # keeping an idle event loop alive, and on Node 22 (checked on 22.16 and 22.18) the runner cancels them.
      # There is no lockfile and nothing to install, so there is no dependency cache either.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Test
        run: npm test
      # The version in .claude-plugin/plugin.json is set by the maintainer's export, never by a pull request.
      - name: Plugin version is not changed by the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          version() { node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version"; }
          base=$(git show "origin/${BASE_REF}:.claude-plugin/plugin.json" | version)
          head=$(version < .claude-plugin/plugin.json)
          echo "base version: ${base}, pull request version: ${head}"
          if [ "${base}" != "${head}" ]; then
            echo "::error file=.claude-plugin/plugin.json::The plugin version is set by the maintainer's export; leave it unchanged."
            exit 1
          fi
